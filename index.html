<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataryWorks - Expense Tracker Dashboard</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            emerald: {
              700: '#198754',
              800: '#0f5132',
              900: '#0a3622',
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.2s ease-out forwards',
            scaleIn: 'scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- HTML2PDF for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Background Canvas Cool Light Gray (Membuat Kartu Putih Sangat Kontras) */
    .bg-dashboard-canvas {
      background-color: #f1f5f9;
      background-attachment: fixed;
    }

    /* Kartu Data Solid, Sharp Border, & Soft Elevation */
    #main-content .bg-white:not(button):not(input):not(select):not(table) {
      background-color: #ffffff !important;
      border: 1px solid #cbd5e1 !important; /* Border Slate 300 yang Tegas */
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04) !important;
      transition: all 0.25s ease-in-out;
    }

    /* Hover Elevation Effect */
    #main-content .bg-white:not(button):not(input):not(select):not(table):hover {
      transform: translateY(-2px);
      border-color: #94a3b8 !important; /* Slate 400 */
      box-shadow: 0 12px 20px -5px rgba(15, 23, 42, 0.1) !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-full flex text-slate-800 antialiased overflow-hidden selection:bg-emerald-100 selection:text-emerald-900 bg-dashboard-canvas">

  <!-- SIDEBAR CONTAINER -->
  <aside id="sidebar-container" class="w-64 shrink-0 h-full overflow-y-auto hidden md:block z-20">
    <!-- Populated dynamically by app.js -->
  </aside>

  <!-- MAIN VIEW CONTAINER -->
  <main id="main-content" class="flex-1 h-full overflow-y-auto p-6 lg:p-8 flex flex-col justify-between">
    <div id="main-view-content" class="max-w-7xl mx-auto w-full space-y-6">
      <!-- Populated dynamically by active view -->
    </div>

    <!-- Footer Credit -->
    <footer class="max-w-7xl mx-auto w-full text-center text-[11px] text-slate-400 pt-8 pb-2 font-medium">
      &copy; 2026 DataryWorks Expense Tracker • Clean Personal Finance Management
    </footer>
  </main>

  <!-- MODAL CONTAINER (Dynamic Popups) -->
  <div id="modal-container" class="hidden"></div>

  <!-- APPLICATION ENTRYPOINT -->
  <script type="module" src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
